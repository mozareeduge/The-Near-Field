name: CI

# Runs this repo's own release gate (qa-release.sh) on every push and pull
# request, so the PR gets a real, visible pass/fail check without needing
# any credentials -- everything it runs is deterministic/static plus real
# local builds, the same gate documented in QA_EVIDENCE.md.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  qa-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: bash qa-release.sh
